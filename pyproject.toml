[project]
name = "arp-table-parser"
version = "0.1.1"
description = "Parse the output of the arp command or /proc/net/arp into structured address-to-interface mappings."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
